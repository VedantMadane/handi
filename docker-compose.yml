services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=handi
      - POSTGRES_PASSWORD=handipassword
      - POSTGRES_DB=handi_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U handi -d handi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://handi:handipassword@db/handi_db
      - SECRET_KEY=changesupersecretkeyinproduction
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python seed_db.py && gunicorn -c gunicorn_conf.py app.main:app"

volumes:
  postgres_data:
